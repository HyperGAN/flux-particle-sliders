[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-sliders-flux-native"
version = "0.1.0a1"
description = "Native full packed Flux ordinary-LoRA ParticleGAN 0.11.0 source candidate"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@c13890f8e2a1ecf1dc8eb9f2a37f9187cb9fea78#subdirectory=packages/particle-sliders-core",
  "particlegan==0.11.0",
  "hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@5f368a3770cf5bdae0448995c9f76e29af8049f7",
  "hndl==0.10.0",
  "diffusers==0.38.0",
  "transformers==4.57.6",
  "sentencepiece==0.2.3",
  "protobuf==7.36.2",
  "accelerate==1.15.0",
  "safetensors==0.8.0",
  "pillow>=13.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
flux-native = "ps_flux_native.cli:main"

[project.entry-points."particle_sliders.response_backends"]
flux_native_packed = "ps_flux_native.lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
flux_native_packed = "ps_flux_native.lifecycle:NATIVE_BACKEND"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ps_flux_native = ["*.hndl", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

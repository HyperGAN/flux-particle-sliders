[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-sliders-flux-packed-preview"
version = "0.2.0"
description = "Flux packed-token native prerequisites; shared training admission blocked"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@c13890f8e2a1ecf1dc8eb9f2a37f9187cb9fea78#subdirectory=packages/particle-sliders-core",
  "hndl==0.10.0",
  "hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@5f368a3770cf5bdae0448995c9f76e29af8049f7",
  "diffusers==0.38.0",
  "transformers==4.57.6",
  "safetensors==0.8.0",
  "pillow>=13.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "build", "setuptools>=84.2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ps_flux_packed_preview = ["*.hndl", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
